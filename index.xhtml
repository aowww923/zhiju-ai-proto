const screenEl = $("#screen"), shot = $("#shot"), spots = $("#spots");&#13;
let cur = "chat", stack = [], busy = false;&#13;
&#13;
function render(id, push) {&#13;
  if (busy || id === cur) return;&#13;
  if (push !== false &amp;&amp; cur &amp;&amp; id !== cur) stack.push(cur);&#13;
  cur = id;&#13;
  screenEl.classList.add("fade");&#13;
  const next = new Image();&#13;
  next.onload = () =&gt; { shot.src = next.src; screenEl.classList.remove("fade"); };&#13;
  next.src = SRC[id];&#13;
  spots.innerHTML = "";&#13;
  (HOT[id] || []).forEach(([x, y, w, h, go]) =&gt; {&#13;
    const b = document.createElement("button");&#13;
    b.className = "sp";&#13;
    b.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;&#13;
    b.title = go.startsWith("say:") ? go.slice(4) : TITLE[go] || go;&#13;
    b.onclick = e =&gt; { e.stopPropagation(); act(go); };&#13;
    spots.appendChild(b);&#13;
  });&#13;
  document.querySelectorAll("#menu button").forEach(b =&gt; b.classList.toggle("on", b.dataset.id === id));&#13;
  $("#cap").textContent = String(SCREENS.findIndex(s =&gt; s[0] === id) + 1).padStart(2, "0") + " / " + TITLE[id];&#13;
}&#13;
function act(go) {&#13;
  if (go === "pay") { say("开通成功 · 标准包 ¥19.9/月"); setTimeout(() =&gt; render("mine"), 900); return; }&#13;
  if (go.startsWith("say:")) return say(go.slice(4));&#13;
  render(go);&#13;
}&#13;
let tid;&#13;
function say(t) {&#13;
  const el = $("#toast"); el.textContent = t; el.classList.add("on");&#13;
  clearTimeout(tid); tid = setTimeout(() =&gt; el.classList.remove("on"), 1600);&#13;
}&#13;
SCREENS.forEach(([id, name]) =&gt; {&#13;
  const li = document.createElement("li");&#13;
  const b = document.createElement("button");&#13;
  b.textContent = name; b.dataset.id = id;&#13;
  b.onclick = () =&gt; { stack = []; render(id, false); };&#13;
  li.appendChild(b); $("#menu").appendChild(li);&#13;
});&#13;

});&#13;

  const btn = $("#demo"); btn.disabled = true; stack = [];&#13;
  const steps = [["chat", 700], ["model", 1300], ["chat", 1300], ["recharge", 1500], ["pay", 1400], ["bill", 1600], ["mine", 1600], ["login", 1500]];&#13;

    render(s, false); await sleep(wait);&#13;
  }&#13;
  btn.disabled = false;&#13;
};&#13;
